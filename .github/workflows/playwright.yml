name: Playwright Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python)
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Prepare .env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            {
              echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
              echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
              echo "VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID"
            } > .env
          fi

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "dev server up"
              exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"
          tail -n 200 /tmp/dev.log
          exit 1

      - name: Run product routing test
        run: bun run test:product-routing

      - name: Run directions E2E test
        run: bun run test:directions

      - name: Run company profile smoke test
        run: bun run test:company-smoke

      - name: Run visual regression test
        run: bun run test:visual

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/diff/
          if-no-files-found: ignore

      - name: Upload current screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-current
          path: tests/visual/current/
          if-no-files-found: ignore

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/screenshots/
          if-no-files-found: ignore

      - name: Upload dev-server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log
          if-no-files-found: ignore
