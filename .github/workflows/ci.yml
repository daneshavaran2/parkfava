name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for the workflow's GITHUB_TOKEN; no job writes to the repo.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (i18n guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  typecheck:
    name: Typecheck + i18n lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run lint:i18n
      - run: bunx tsgo --noEmit
        continue-on-error: true

  e2e-request-id:
    name: E2E x-request-id propagation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: bun install --frozen-lockfile
      - run: |
          LOG_SINK=memory NODE_ENV=development bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..60}; do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - run: bun run test:request-id
      - if: always()
        run: kill $(cat /tmp/dev.pid) 2>/dev/null || true

  e2e-directions:
    name: E2E directions buttons (FA/EN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: bun install --frozen-lockfile
      - run: pip install playwright && playwright install chromium
      - run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..60}; do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - run: bun run test:directions
      - if: always()
        run: kill $(cat /tmp/dev.pid) 2>/dev/null || true



  e2e-company-smoke:
    name: E2E company profile smoke (light theme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: bun install --frozen-lockfile
      - run: pip install playwright && playwright install chromium
      - run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..60}; do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - run: bun run test:company-smoke
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: company-smoke-screenshots
          path: tests/smoke/screenshots/
          if-no-files-found: ignore
      - if: always()
        run: kill $(cat /tmp/dev.pid) 2>/dev/null || true

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: bun install --frozen-lockfile
      - run: pip install playwright pillow && playwright install chromium
      - run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..60}; do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - run: bun run test:visual
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: tests/visual/diff/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-current
          path: tests/visual/current/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baseline
          path: tests/visual/baseline/
          if-no-files-found: ignore
      - if: always()
        run: kill $(cat /tmp/dev.pid) 2>/dev/null || true
